# Per-joint PID gains for AtlasPlugin's whole-body position controller
# (atlas_version 5, 30 joints including both wry2 wrist joints).
#
# Converted from the original drcsim's pr2_controller_manager-era
# config/whole_body_trajectory_controller_v5.yaml -- same joints, same
# gain values, just its `gains:` block reshaped into a ROS 2 params file
# for the `atlas_plugin` node (see AtlasPlugin::LoadPIDGainsFromParameter,
# which reads exactly "atlas_controller.gains.<joint>.{p,i,d,i_clamp}").
# The original file's `joints:`/`type:`/`joint_trajectory_action_node:`
# blocks configured a pr2_controller_manager JointTrajectoryActionController
# that has no equivalent here -- AtlasPlugin is already the whole-body
# controller, so only the gain values themselves carry over.
#
# Loaded via the DRCSIM_ROS_PARAMS_FILE mechanism (see
# drcsim_gazebo_ros_plugins/include/drcsim_gazebo_ros_plugins/
# RosNodeOptions.hpp) -- see launch/atlas.launch.py.
atlas_plugin:
  ros__parameters:
    atlas_controller.gains.l_leg_hpz.p: 5.0
    atlas_controller.gains.l_leg_hpz.d: 0.01
    atlas_controller.gains.l_leg_hpz.i: 0.0
    atlas_controller.gains.l_leg_hpz.i_clamp: 0.0

