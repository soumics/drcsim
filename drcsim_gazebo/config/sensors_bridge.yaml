# gz -> ROS bridges for Atlas's sensors (ros_gz_bridge parameter_bridge).
# The sensors' gz topics and TF frame ids are set in the URDF/gazebo files
# (<topic>, <gz_frame_id>), so ROS gets the same names.
- ros_topic_name: multisense/left/image_raw
  gz_topic_name: multisense/left/image_raw
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS
- ros_topic_name: multisense/left/camera_info
  gz_topic_name: multisense/left/camera_info
  ros_type_name: sensor_msgs/msg/CameraInfo
  gz_type_name: gz.msgs.CameraInfo
  direction: GZ_TO_ROS
- ros_topic_name: multisense/right/image_raw
  gz_topic_name: multisense/right/image_raw
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS
- ros_topic_name: multisense/right/camera_info
  gz_topic_name: multisense/right/camera_info
  ros_type_name: sensor_msgs/msg/CameraInfo
  gz_type_name: gz.msgs.CameraInfo
  direction: GZ_TO_ROS
- ros_topic_name: multisense/lidar_scan
  gz_topic_name: multisense/lidar_scan
  ros_type_name: sensor_msgs/msg/LaserScan
  gz_type_name: gz.msgs.LaserScan
  direction: GZ_TO_ROS
- ros_topic_name: multisense/lidar_points
  gz_topic_name: multisense/lidar_scan/points
  ros_type_name: sensor_msgs/msg/PointCloud2
  gz_type_name: gz.msgs.PointCloudPacked
  direction: GZ_TO_ROS
- ros_topic_name: multisense/imu
  gz_topic_name: multisense/imu
  ros_type_name: sensor_msgs/msg/Imu
  gz_type_name: gz.msgs.IMU
  direction: GZ_TO_ROS
- ros_topic_name: atlas/imu
  gz_topic_name: atlas/imu
  ros_type_name: sensor_msgs/msg/Imu
  gz_type_name: gz.msgs.IMU
  direction: GZ_TO_ROS
- ros_topic_name: atlas/l_situational_awareness_camera/image_raw
  gz_topic_name: atlas/l_situational_awareness_camera/image_raw
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS
- ros_topic_name: atlas/r_situational_awareness_camera/image_raw
  gz_topic_name: atlas/r_situational_awareness_camera/image_raw
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS
# Chase camera for demo videos (atlas.launch.py demo_camera:=true).
- ros_topic_name: demo_camera/image
  gz_topic_name: demo_camera/image
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS
